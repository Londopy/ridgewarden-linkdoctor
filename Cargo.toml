[package]
name = "ridgewarden-linkdoctor"
version = "0.1.0"
description = "Link Doctor for AREDN meshes: link history, slow-drift and flapping alerts, single points of failure, and what to fix on the next workday"
edition = "2024"
license = "GPL-3.0-or-later"
authors = ["Londopy"]
repository = "https://github.com/Londopy/ridgewarden-linkdoctor"
homepage = "https://github.com/Londopy/ridgewarden-linkdoctor"
rust-version = "1.88"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "json", "query"] }
clap = { version = "4.6.8", features = ["derive"] }
# the core's shared client crate, from a sibling checkout of github.com/Londopy/ridgewarden
ridgewarden-client = { path = "../ridgewarden/crates/ridgewarden-client" }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
tempfile = "3.27.0"
